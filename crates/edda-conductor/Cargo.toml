[package]
name = "edda-conductor"
description = "Multi-phase plan orchestration for Edda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
edda-store = { path = "../edda-store", version = "0.4.0" }
edda-core = { path = "../edda-core", version = "0.4.0" }
edda-ledger = { path = "../edda-ledger", version = "0.4.0" }
edda-derive = { path = "../edda-derive", version = "0.4.0" }
edda-notify = { path = "../edda-notify", version = "0.4.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml = "0.0.12"
time.workspace = true
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
regex.workspace = true
uuid.workspace = true
agent-client-protocol.workspace = true

[dev-dependencies]
tempfile.workspace = true
# GH-541: gate read-error tests use tokio::time::start_paused.
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "io-util", "macros", "test-util"] }
# GH-541: the gate's read-error tracker classifies SQLite busy/lock errors
# as transient; tests construct those errors directly.
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
