name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue only runs checks that trigger on merge_group; without this
  # a queued entry would wait forever for the required check to appear.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Trim debug info in CI: keeps readable backtraces (function name + line) but
  # skips the heavy PDB generation and linking that dominate Windows build time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --check
      - run: sh -n install.sh scripts/lint-markdown-content.sh
      - name: Lint Markdown content
        run: sh scripts/lint-markdown-content.sh
      - name: Verify installer latest-version stdout
        shell: bash
        run: |
          source <(awk '/^main\(\)/ { exit } { print }' install.sh)
          VERSION=""
          download_to_stdout() { printf '%s\n' '{"tag_name":"v0.0.0"}'; }
          test "$(resolve_version)" = "v0.0.0"

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          # Windows build/link is ~5x slower, so it runs only the crates whose
          # behaviour actually diverges by platform instead of all 23.
          # Linux/macOS keep full-workspace coverage.
          #
          # Each crate below earns its place against a concrete criterion; the
          # list is derived from these, not curated, so it cannot silently drift
          # from the rule (it did — GH-433 caught edda-conductor and
          # edda-transcript missing while the comment named their criteria):
          #   process spawn (Command::new):  edda, edda-bridge-claude, edda-conductor
          #   file locks (fs2):              edda-store, edda-ledger, edda-search-fts, edda-transcript
          #   mmap (tantivy):                edda-search-fts
          - os: windows-latest
            args: >-
              -p edda-store
              -p edda-ledger
              -p edda-search-fts
              -p edda-transcript
              -p edda-bridge-claude
              -p edda-conductor
              -p edda
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  # Aggregate gate: the single check the branch ruleset will pin instead of
  # enumerating the seven individual jobs. `if: always()` keeps it running even
  # when an upstream job fails, so the verdict table is always printed.
  # `skipped` counts as failure for now: no path filters exist yet, so a skip
  # would mean misconfiguration; the path-filter change (#631) relaxes this.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    if: always()
    steps:
      - name: Evaluate upstream job results
        run: |
          printf '%-10s -> %s\n' fmt "${{ needs.fmt.result }}"
          printf '%-10s -> %s\n' clippy "${{ needs.clippy.result }}"
          printf '%-10s -> %s\n' test "${{ needs.test.result }}"
          for result in "${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Upstream job did not succeed (result: $result). skipped/failure/cancelled all fail the gate (see #631 for future skipped handling)."
              exit 1
            fi
          done
          echo "All upstream jobs succeeded."
