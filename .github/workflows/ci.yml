name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue only runs checks that trigger on merge_group; without this
  # a queued entry would wait forever for the required check to appear.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Path-aware triage (#631): decide once whether the diff touches code. If it
  # does not (docs-only), clippy/test/msrv are skipped and the CI Gate treats
  # those skips as a pass. When in doubt — any diff-computation error or unknown
  # base — we set code=true and run everything.
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      fleet: ${{ steps.diff.outputs.fleet }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the merge-base SHAs below always resolve.
          fetch-depth: 0
      - name: Diff base..head against the code whitelist
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -u
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              base=$PR_BASE head=$PR_HEAD ;;
            merge_group)
              base=$MG_BASE head=$MG_HEAD ;;
            push)
              head=$PUSH_HEAD
              # An EMPTY or all-zero `before` (new branch, or unknown previous
              # commit) forces code=true; a valid `before` is diffed normally.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                base=
              else
                base=$PUSH_BEFORE
              fi
              ;;
            *)
              base= head= ;;  # unknown event: assume code changed
          esac
          code=true
          # GH-896: separate, narrower whitelist for the fleet shell-test gate
          # — unrelated PRs keep it skipped (green-fast). On any diff failure
          # or unknown base we assume fleet tests changed too, same policy as
          # code above. The terms are globs: scripts/test-*.sh (added by
          # #927) subsumes the scripts/test-review-capabilities.sh name an
          # earlier revision listed here, and scripts/fleet/test-*.ps1 brings
          # the Windows-only PowerShell tests under the same trigger.
          fleet=false
          if [ -n "$base" ] \
            && git cat-file -e "$base" 2>/dev/null \
            && git cat-file -e "$head" 2>/dev/null; then
            diffout=$(mktemp)
            # -z: NUL-delimited output, so git's C-quoting of non-ASCII or
            # control characters ("crates/\303\251.rs") and embedded newlines
            # in pathnames cannot corrupt the matcher.
            # --no-renames: a crates/ -> docs/ rename lists BOTH sides, so the
            # deleted code path still trips the whitelist.
            if git diff --name-only -z --no-renames "$base" "$head" > "$diffout"; then
              code=false
              echo "--- changed files ($base..$head) ---"
              while IFS= read -r -d '' f; do
                printf '%s\n' "$f"
                # Whitelist: any match means code changed (err on running more).
                case "$f" in
                  crates/*|spec/events/*|tests/fixtures/events/*|Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|.github/workflows/*|scripts/*|install.sh|build.rs)
                    code=true ;;
                esac
                case "$f" in
                  scripts/fleet/*|scripts/test-*.sh|scripts/fleet/test-*.ps1|.github/workflows/ci.yml)
                    fleet=true ;;
                esac
              done < "$diffout"
            else
              echo "git diff failed; assuming code changed."
              fleet=true
            fi
            rm -f "$diffout"
          else
            echo "Diff could not be computed (base: '${base:-none}'); assuming code changed."
            fleet=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "fleet=$fleet" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version and its components; `rustup show`
      # installs it and prints it, so the log records which compiler ran.
      - run: rustup show
      - run: cargo fmt --check
      - run: sh -n install.sh scripts/lint-markdown-content.sh
      - run: bash -n scripts/lint-file-length.sh
      - name: Lint file length (GH-779)
        run: bash scripts/lint-file-length.sh --tree
      - name: Lint Markdown content
        run: sh scripts/lint-markdown-content.sh
      - name: Lint documentation citations (GH-794)
        run: |
          bash -n scripts/lint-doc-citations.sh scripts/test-doc-citations.sh
          bash scripts/lint-doc-citations.sh --tree
          bash scripts/test-doc-citations.sh
      - name: Verify installer latest-version stdout
        shell: bash
        run: |
          source <(awk '/^main\(\)/ { exit } { print }' install.sh)
          VERSION=""
          download_to_stdout() { printf '%s\n' '{"tag_name":"v0.0.0"}'; }
          test "$(resolve_version)" = "v0.0.0"

  clippy:
    name: Clippy (${{ matrix.os }})
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          # Windows build/link is ~5x slower, so it runs only the crates whose
          # behaviour actually diverges by platform instead of all 23.
          # Linux/macOS keep full-workspace coverage.
          #
          # Each crate below earns its place against a concrete criterion; the
          # list is derived from these, not curated, so it cannot silently drift
          # from the rule (it did — GH-433 caught edda-conductor and
          # edda-transcript missing while the comment named their criteria):
          #   process spawn (Command::new):  edda, edda-bridge-claude, edda-conductor
          #   file locks (fs2):              edda-store, edda-ledger, edda-search-fts, edda-transcript
          #   mmap (tantivy):                edda-search-fts
          - os: windows-latest
            args: >-
              -p edda-store
              -p edda-ledger
              -p edda-search-fts
              -p edda-transcript
              -p edda-bridge-claude
              -p edda-conductor
              -p edda
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}
      # GH-650: docs/reference/cli.md must not silently fall behind the CLI
      # surface. A step inside the existing test job — not a new required
      # check; the CI Gate aggregation is untouched.
      - name: Check CLI docs coverage (GH-650)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build -p edda
          EDDA_BIN=target/debug/edda bash scripts/check-cli-docs.sh

  # MSRV gate (GH-824): Cargo.toml declares rust-version = "1.91", but the
  # pinned build toolchain (rust-toolchain.toml) is newer, so no other CI job
  # would catch code using 1.92+ APIs. Compile the workspace with exactly
  # 1.91.0 — check only, no tests — so downstream consumers on 1.91 keep
  # building when the crates are published.
  msrv:
    name: MSRV (1.91.0)
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.91.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91.0
      - run: cargo +1.91.0 check --workspace --all-targets --locked

  # GH-896: no machine gate ran any fleet shell test — grep over .github/
  # found nothing and lefthook runs cargo only, so their doneWhen rested on
  # hand execution. This job is that gate. The runner is glob-driven over
  # scripts/fleet/test-*.sh, so a test added there later is picked up without
  # touching this file; a red test exits non-zero and ci-gate propagates it.
  #
  # Not everything runs here. scripts/test-review-capabilities.sh runs in
  # fleet-tests-windows below (ubuntu's dash rejects the `set -o pipefail` in
  # the helper it generates). Some tests are QUARANTINED in the runner, which
  # names each one, the measured failure, and the issue that owns removing it,
  # and prints a count so the list cannot grow quietly. That file is the single
  # source for which tests those are — deliberately not repeated here.
  fleet-tests:
    name: Fleet shell tests
    needs: [detect]
    if: needs.detect.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # see fleet-tests-windows: origin/main must exist for the tests that
          # resolve it, and a depth-1 checkout has no such ref.
          fetch-depth: 0
      - name: Run fleet shell tests
        run: sh scripts/fleet/run-fleet-tests.sh

  # GH-896 round 1 (P0-1) asked for the second route #896's doneWhen offers,
  # since some of its tests cannot run on ubuntu. This job is it, and it runs
  # exactly one test: scripts/test-review-capabilities.sh, whose generated
  # helper carries `set -o pipefail` (the `set -o pipefail` it writes into that runner, `scripts/review-pr.sh`) — ubuntu's sh
  # is dash and rejects it with `Illegal option`, so there the test would fail
  # for the shell rather than for anything it asserts. Here sh is Git Bash.
  #
  # It does NOT run test-lane-helpers.sh: that test is red on this runner too
  # (case 0, `prepare: worktree not registered`) as well as on a Windows
  # workstation, so it is quarantined in run-fleet-tests.sh under #963 and
  # executes nowhere. That is the one #896 doneWhen item this gate does not
  # deliver, which is why the PR carries no closing keyword.
  #
  # Shares the detect.fleet path filter with the ubuntu job; ci-gate evaluates
  # its verdict the same way: a skip is accepted only when detect.fleet is
  # 'false', and any failure or cancellation fails the gate.
  fleet-tests-windows:
    name: Fleet shell tests (windows)
    needs: [detect]
    if: needs.detect.outputs.fleet == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          # test-next-loop.sh and test-issue-freshness.sh resolve origin/main;
          # the default depth-1 checkout has no such ref and they exit non-zero
          # on a fatal 'ambiguous argument' rather than on anything they test.
          fetch-depth: 0
      - name: Run the Windows-only fleet tests
        # Not the glob runner: this is the one test the ubuntu job cannot run
        # but this one can. test-review-capabilities.sh generates a Linux
        # runner from scripts/review-pr.sh carrying a bash shebang and
        # `set -o pipefail`; ubuntu's sh is dash and rejects it with 'Illegal
        # option', so there the test fails for the shell rather than for
        # anything it asserts. Here sh is Git Bash, so it runs.
        #
        # The quarantined tests are NOT here either — they are red on this
        # runner too. run-fleet-tests.sh is the single place that names them
        # and the issue that owns each; no list is duplicated here, because a
        # second copy is a second thing to forget to update.
        #
        # GH-927: this job also carries the scripts/fleet/test-*.ps1 group —
        # glob-driven, fail-closed, one run each on windows-latest. On a
        # Windows workstation the entrypoint runs the same group itself, so
        # the glob exists in exactly two places that never both execute.
        run: |
          sh scripts/test-review-capabilities.sh
          status=0
          for p in scripts/fleet/test-*.ps1; do
            if [ ! -e "$p" ]; then
              echo "FAIL: $p matched no file" >&2
              exit 1
            fi
            case "$p" in
              scripts/fleet/test-detached-dispatch.ps1)
                # Harness-bound: -Edda is Mandatory (a compiled edda binary,
                # GH-605) and no CI job compiles the workspace. Stated per
                # #927's doneWhen.
                echo "SKIP $p (harness-bound: needs -Edda <built edda binary>)"
                continue ;;
            esac
            echo "RUN  $p"
            pwsh -NoProfile -File "$p" || status=1
          done
          exit "$status"

  # Aggregate gate: the single check the branch ruleset will pin instead of
  # enumerating the eight individual jobs. `if: always()` keeps it running even
  # when an upstream job fails or is skipped, so the verdict table is always
  # printed. #631: clippy/test/msrv being skipped is accepted only when detect
  # decided the change was docs-only (code=false); any other skip, failure,
  # or cancellation still fails the gate.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [detect, fmt, clippy, test, msrv, fleet-tests, fleet-tests-windows]
    if: always()
    steps:
      - name: Evaluate upstream job results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CODE: ${{ needs.detect.outputs.code }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          FLEET_RESULT: ${{ needs.fleet-tests.result }}
          FLEET_WIN_RESULT: ${{ needs.fleet-tests-windows.result }}
          FLEET: ${{ needs.detect.outputs.fleet }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          printf '%-19s -> %s\n' detect "$DETECT_RESULT"
          printf '%-19s -> %s\n' fmt "$FMT_RESULT"
          printf '%-19s -> %s\n' clippy "$CLIPPY_RESULT"
          printf '%-19s -> %s\n' test "$TEST_RESULT"
          printf '%-19s -> %s\n' msrv "$MSRV_RESULT"
          printf '%-19s -> %s\n' fleet-tests "$FLEET_RESULT"
          printf '%-19s -> %s\n' fleet-tests-windows "$FLEET_WIN_RESULT"
          [ "$DETECT_RESULT" = "success" ] || fail "detect did not succeed (result: $DETECT_RESULT)."
          [ "$FMT_RESULT" = "success" ] || fail "fmt did not succeed (result: $FMT_RESULT)."
          # GH-896: fleet-tests and fleet-tests-windows are evaluated FIRST
          # so their failure cannot be swallowed by the early success exits
          # below. Each is skipped only when detect decided no fleet path
          # (scripts/fleet/**, scripts/test-review-capabilities.sh, workflow)
          # changed; any other skip, failure, or cancellation fails the gate.
          if [ "$FLEET_RESULT" = "success" ]; then
            echo "Fleet shell tests succeeded."
          elif [ "$FLEET_RESULT" = "skipped" ] && [ "$FLEET" = "false" ]; then
            echo "Fleet shell tests skipped (no fleet path change): accepted."
          else
            fail "fleet-tests did not succeed (fleet-tests: $FLEET_RESULT, detect.fleet: $FLEET)."
          fi
          if [ "$FLEET_WIN_RESULT" = "success" ]; then
            echo "Fleet shell tests (windows) succeeded."
          elif [ "$FLEET_WIN_RESULT" = "skipped" ] && [ "$FLEET" = "false" ]; then
            echo "Fleet shell tests (windows) skipped (no fleet path change): accepted."
          else
            fail "fleet-tests-windows did not succeed (fleet-tests-windows: $FLEET_WIN_RESULT, detect.fleet: $FLEET)."
          fi
          if [ "$CLIPPY_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] && [ "$MSRV_RESULT" = "success" ]; then
            echo "All upstream jobs succeeded."
            exit 0
          fi
          if [ "$CLIPPY_RESULT" = "skipped" ] && [ "$TEST_RESULT" = "skipped" ] && [ "$MSRV_RESULT" = "skipped" ] && [ "$CODE" = "false" ]; then
            echo "Docs-only change (detect: code=false): clippy/test/msrv skipped, gate passes."
            exit 0
          fi
          fail "clippy/test/msrv did not succeed (clippy: $CLIPPY_RESULT, test: $TEST_RESULT, msrv: $MSRV_RESULT, detect.code: $CODE)."
