name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue only runs checks that trigger on merge_group; without this
  # a queued entry would wait forever for the required check to appear.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Trim debug info in CI: keeps readable backtraces (function name + line) but
  # skips the heavy PDB generation and linking that dominate Windows build time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Path-aware triage (#631): decide once whether the diff touches code. If it
  # does not (docs-only), clippy/test/msrv are skipped and the CI Gate treats
  # those skips as a pass. When in doubt — any diff-computation error or unknown
  # base — we set code=true and run everything.
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the merge-base SHAs below always resolve.
          fetch-depth: 0
      - name: Diff base..head against the code whitelist
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -u
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              base=$PR_BASE head=$PR_HEAD ;;
            merge_group)
              base=$MG_BASE head=$MG_HEAD ;;
            push)
              head=$PUSH_HEAD
              # An EMPTY or all-zero `before` (new branch, or unknown previous
              # commit) forces code=true; a valid `before` is diffed normally.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                base=
              else
                base=$PUSH_BEFORE
              fi
              ;;
            *)
              base= head= ;;  # unknown event: assume code changed
          esac
          code=true
          if [ -n "$base" ] \
            && git cat-file -e "$base" 2>/dev/null \
            && git cat-file -e "$head" 2>/dev/null; then
            diffout=$(mktemp)
            # -z: NUL-delimited output, so git's C-quoting of non-ASCII or
            # control characters ("crates/\303\251.rs") and embedded newlines
            # in pathnames cannot corrupt the matcher.
            # --no-renames: a crates/ -> docs/ rename lists BOTH sides, so the
            # deleted code path still trips the whitelist.
            if git diff --name-only -z --no-renames "$base" "$head" > "$diffout"; then
              code=false
              echo "--- changed files ($base..$head) ---"
              while IFS= read -r -d '' f; do
                printf '%s\n' "$f"
                # Whitelist: any match means code changed (err on running more).
                case "$f" in
                  crates/*|Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|.github/workflows/*|scripts/*|install.sh|build.rs)
                    code=true ;;
                esac
              done < "$diffout"
            else
              echo "git diff failed; assuming code changed."
            fi
            rm -f "$diffout"
          else
            echo "Diff could not be computed (base: '${base:-none}'); assuming code changed."
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version and its components; `rustup show`
      # installs it and prints it, so the log records which compiler ran.
      - run: rustup show
      - run: cargo fmt --check
      - run: sh -n install.sh scripts/lint-markdown-content.sh
      - run: bash -n scripts/lint-file-length.sh
      - name: Lint file length (GH-779)
        run: bash scripts/lint-file-length.sh --tree
      - name: Lint Markdown content
        run: sh scripts/lint-markdown-content.sh
      - name: Verify installer latest-version stdout
        shell: bash
        run: |
          source <(awk '/^main\(\)/ { exit } { print }' install.sh)
          VERSION=""
          download_to_stdout() { printf '%s\n' '{"tag_name":"v0.0.0"}'; }
          test "$(resolve_version)" = "v0.0.0"

  clippy:
    name: Clippy (${{ matrix.os }})
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          # Windows build/link is ~5x slower, so it runs only the crates whose
          # behaviour actually diverges by platform instead of all 23.
          # Linux/macOS keep full-workspace coverage.
          #
          # Each crate below earns its place against a concrete criterion; the
          # list is derived from these, not curated, so it cannot silently drift
          # from the rule (it did — GH-433 caught edda-conductor and
          # edda-transcript missing while the comment named their criteria):
          #   process spawn (Command::new):  edda, edda-bridge-claude, edda-conductor
          #   file locks (fs2):              edda-store, edda-ledger, edda-search-fts, edda-transcript
          #   mmap (tantivy):                edda-search-fts
          - os: windows-latest
            args: >-
              -p edda-store
              -p edda-ledger
              -p edda-search-fts
              -p edda-transcript
              -p edda-bridge-claude
              -p edda-conductor
              -p edda
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}
      # GH-650: docs/reference/cli.md must not silently fall behind the CLI
      # surface. A step inside the existing test job — not a new required
      # check; the CI Gate aggregation is untouched.
      - name: Check CLI docs coverage (GH-650)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build -p edda
          EDDA_BIN=target/debug/edda bash scripts/check-cli-docs.sh

  # MSRV gate (GH-824): Cargo.toml declares rust-version = "1.91", but the
  # pinned build toolchain (rust-toolchain.toml) is newer, so no other CI job
  # would catch code using 1.92+ APIs. Compile the workspace with exactly
  # 1.91.0 — check only, no tests — so downstream consumers on 1.91 keep
  # building when the crates are published.
  msrv:
    name: MSRV (1.91.0)
    needs: [detect]
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.91.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91.0
      - run: cargo +1.91.0 check --workspace --all-targets --locked

  # Aggregate gate: the single check the branch ruleset will pin instead of
  # enumerating the eight individual jobs. `if: always()` keeps it running even
  # when an upstream job fails or is skipped, so the verdict table is always
  # printed. #631: clippy/test/msrv being skipped is accepted only when detect
  # decided the change was docs-only (code=false); any other skip, failure,
  # or cancellation still fails the gate.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [detect, fmt, clippy, test, msrv]
    if: always()
    steps:
      - name: Evaluate upstream job results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CODE: ${{ needs.detect.outputs.code }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          printf '%-10s -> %s\n' detect "$DETECT_RESULT"
          printf '%-10s -> %s\n' fmt "$FMT_RESULT"
          printf '%-10s -> %s\n' clippy "$CLIPPY_RESULT"
          printf '%-10s -> %s\n' test "$TEST_RESULT"
          printf '%-10s -> %s\n' msrv "$MSRV_RESULT"
          [ "$DETECT_RESULT" = "success" ] || fail "detect did not succeed (result: $DETECT_RESULT)."
          [ "$FMT_RESULT" = "success" ] || fail "fmt did not succeed (result: $FMT_RESULT)."
          if [ "$CLIPPY_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] && [ "$MSRV_RESULT" = "success" ]; then
            echo "All upstream jobs succeeded."
            exit 0
          fi
          if [ "$CLIPPY_RESULT" = "skipped" ] && [ "$TEST_RESULT" = "skipped" ] && [ "$MSRV_RESULT" = "skipped" ] && [ "$CODE" = "false" ]; then
            echo "Docs-only change (detect: code=false): clippy/test/msrv skipped, gate passes."
            exit 0
          fi
          fail "clippy/test/msrv did not succeed (clippy: $CLIPPY_RESULT, test: $TEST_RESULT, msrv: $MSRV_RESULT, detect.code: $CODE)."
