name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-crates:
    name: Prepare crates.io publication
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Validate tag and derive workspace publish order
        run: python3 scripts/publish-crates.py plan --tag "$GITHUB_REF_NAME"
      - name: Check publication credential
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is absent; publish-crates and downstream GitHub Release jobs are skipped."
            echo "CARGO_REGISTRY_TOKEN is absent. Crates publication and GitHub Release are skipped; configure the repository secret and rerun." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-crates:
    name: Publish workspace to crates.io
    needs: prepare-crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare-crates.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Publish in dependency order and verify immutable source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish-crates.py publish --tag "$GITHUB_REF_NAME"

  create-release:
    name: Create Release
    needs: publish-crates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        # rust-toolchain.toml pins the version; `rustup show` installs it and
        # prints it into the log.
        run: rustup show
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Verify crates.io release parity and tag source
        run: python3 scripts/publish-crates.py verify --tag "$GITHUB_REF_NAME"
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_notes="$(awk -v heading="## [$version]" '
            { sub(/\r$/, "") }
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$release_notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '%s\n' "$release_notes" > "$RUNNER_TEMP/release-notes.md"
      - name: Create or reuse draft release
        shell: bash
        run: |
          if existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>/dev/null)"; then
            if [ "$(jq -r '.isDraft' <<<"$existing")" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            echo "Reusing existing draft release $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --fail-on-no-commits --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "$(cat "$RUNNER_TEMP/release-notes.md")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            cross: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux native deps
        if: contains(matrix.target, 'linux-gnu')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p edda

      - name: Prepare archive (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          ARCHIVE="edda-${TAG}-${{ matrix.target }}"
          mkdir "$ARCHIVE"
          cp target/${{ matrix.target }}/release/edda "$ARCHIVE/"
          cp LICENSE-MIT LICENSE-APACHE "$ARCHIVE/"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "ASSET=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"

      - name: Prepare archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = "${{ needs.create-release.outputs.tag }}"
          $ARCHIVE = "edda-${TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE
          Copy-Item "target\${{ matrix.target }}\release\edda.exe" "$ARCHIVE\"
          Copy-Item "LICENSE-MIT" "$ARCHIVE\"
          Copy-Item "LICENSE-APACHE" "$ARCHIVE\"
          Compress-Archive -Path "$ARCHIVE\*" -DestinationPath "${ARCHIVE}.zip"
          $hash = (Get-FileHash "${ARCHIVE}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${ARCHIVE}.zip" | Out-File -Encoding ASCII "${ARCHIVE}.zip.sha256"
          echo "ASSET=${ARCHIVE}.zip" >> $env:GITHUB_ENV

      - name: Verify draft release and upload assets
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release $tag is no longer a draft; refusing to replace assets"
            exit 1
          fi
          gh release upload "$tag" "${{ env.ASSET }}" "${{ env.ASSET }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          expected=(
            "edda-${tag}-x86_64-unknown-linux-gnu.tar.gz"
            "edda-${tag}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "edda-${tag}-aarch64-unknown-linux-gnu.tar.gz"
            "edda-${tag}-aarch64-unknown-linux-gnu.tar.gz.sha256"
            "edda-${tag}-x86_64-apple-darwin.tar.gz"
            "edda-${tag}-x86_64-apple-darwin.tar.gz.sha256"
            "edda-${tag}-aarch64-apple-darwin.tar.gz"
            "edda-${tag}-aarch64-apple-darwin.tar.gz.sha256"
            "edda-${tag}-x86_64-pc-windows-msvc.zip"
            "edda-${tag}-x86_64-pc-windows-msvc.zip.sha256"
          )

          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Release asset set is incomplete or unexpected"
            exit 1
          fi

          empty_assets="$(gh release view "$tag" --json assets \
            --jq '.assets[] | select(.size == 0) | .name')"
          if [ -n "$empty_assets" ]; then
            echo "::error::Release contains empty assets"
            printf '%s\n' "$empty_assets"
            exit 1
          fi

          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release $tag is no longer a draft; refusing to publish"
            exit 1
          fi

          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$tag" --dir "$asset_dir" --pattern 'edda-*'
          (
            cd "$asset_dir"
            for checksum in *.sha256; do
              archive="${checksum%.sha256}"
              expected_hash="$(awk '{ print tolower($1) }' "$checksum" | tr -d '\r\n')"
              actual_hash="$(sha256sum "$archive" | awk '{ print $1 }')"
              if [[ ! "$expected_hash" =~ ^[0-9a-f]{64}$ ]] || [ "$actual_hash" != "$expected_hash" ]; then
                echo "::error::Checksum mismatch for $archive"
                exit 1
              fi
            done

          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run native asset canary without repository credentials
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          cd "$RUNNER_TEMP/release-assets"
          native_dir="edda-${tag}-x86_64-unknown-linux-gnu"
          tar -xzf "${native_dir}.tar.gz"
          actual_version="$(env -u GH_TOKEN -u GITHUB_TOKEN "./${native_dir}/edda" --version)"
          # edda --version may carry a build identity suffix (GH-746), e.g.
          # "edda 0.5.0 (e36a9ed55916 2026-09-04)"; tarball builds report
          # "(unknown)". Compare the version core only.
          core="${actual_version#edda }"
          core="${core%% (*}"
          if [ "$core" != "${tag#v}" ]; then
            echo "::error::Native asset reports '$actual_version', expected 'edda ${tag#v}' (optionally with a build identity suffix)"
            exit 1
          fi
      - name: Publish release
        run: >-
          gh release edit "${{ needs.create-release.outputs.tag }}"
          --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
