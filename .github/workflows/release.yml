name: Release

on:
  push:
    tags:
      - "v*"
  # PR runs exercise only the crates.io packaging dry run and the token
  # skip-gate (GH-648); every tag job below is guarded to tag pushes, so tag
  # behavior is unchanged.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
  # Explicit topological publish order (dependencies before dependents),
  # derived from `cargo metadata` at GH-648 review time and validated against
  # the workspace member set by the "Validate publish order" step in both
  # publish-crates-dry-run and publish-crates. `edda` (the CLI binary crate in
  # crates/edda-cli) is deliberately LAST. Per-crate publishing (instead of
  # `cargo publish --workspace`, which CI's stable toolchain would also
  # support) is required for re-run safety: --workspace aborts on the first
  # "already uploaded" crate and would leave the remaining crates unpublished
  # on every subsequent re-run.
  CRATES_PUBLISH_ORDER: "edda-core edda-ledger edda-derive edda-store edda-aggregate edda-index edda-notify edda-pack edda-postmortem edda-search-fts edda-transcript edda-bridge-claude edda-bridge-codex edda-bridge-cursor edda-bridge-hermes edda-bridge-openclaw edda-ask edda-mcp edda-conductor edda-ingestion edda-serve edda-chronicle edda"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}"
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          mismatches="$(jq -r --arg version "$version" '
            .workspace_members as $members
            | .packages[]
            | select(.id as $id | $members | index($id))
            | select(.version != $version)
            | "\(.name)=\(.version)"
          ' <<<"$metadata")"
          if [ -n "$mismatches" ]; then
            echo "::error::Workspace package versions do not match tag $version"
            printf '%s\n' "$mismatches"
            exit 1
          fi
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_notes="$(awk -v heading="## [$version]" '
            { sub(/\r$/, "") }
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$release_notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '%s\n' "$release_notes" > "$RUNNER_TEMP/release-notes.md"
      - name: Create or reuse draft release
        shell: bash
        run: |
          if existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>/dev/null)"; then
            if [ "$(jq -r '.isDraft' <<<"$existing")" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            echo "Reusing existing draft release $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --fail-on-no-commits --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "$(cat "$RUNNER_TEMP/release-notes.md")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build (${{ matrix.name }})
    needs: create-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            cross: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux native deps
        if: contains(matrix.target, 'linux-gnu')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p edda

      - name: Prepare archive (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          ARCHIVE="edda-${TAG}-${{ matrix.target }}"
          mkdir "$ARCHIVE"
          cp target/${{ matrix.target }}/release/edda "$ARCHIVE/"
          cp LICENSE-MIT LICENSE-APACHE "$ARCHIVE/"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "ASSET=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"

      - name: Prepare archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = "${{ needs.create-release.outputs.tag }}"
          $ARCHIVE = "edda-${TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE
          Copy-Item "target\${{ matrix.target }}\release\edda.exe" "$ARCHIVE\"
          Copy-Item "LICENSE-MIT" "$ARCHIVE\"
          Copy-Item "LICENSE-APACHE" "$ARCHIVE\"
          Compress-Archive -Path "$ARCHIVE\*" -DestinationPath "${ARCHIVE}.zip"
          $hash = (Get-FileHash "${ARCHIVE}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${ARCHIVE}.zip" | Out-File -Encoding ASCII "${ARCHIVE}.zip.sha256"
          echo "ASSET=${ARCHIVE}.zip" >> $env:GITHUB_ENV

      - name: Verify draft release and upload assets
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release $tag is no longer a draft; refusing to replace assets"
            exit 1
          fi
          gh release upload "$tag" "${{ env.ASSET }}" "${{ env.ASSET }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          expected=(
            "edda-${tag}-x86_64-unknown-linux-gnu.tar.gz"
            "edda-${tag}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "edda-${tag}-aarch64-unknown-linux-gnu.tar.gz"
            "edda-${tag}-aarch64-unknown-linux-gnu.tar.gz.sha256"
            "edda-${tag}-x86_64-apple-darwin.tar.gz"
            "edda-${tag}-x86_64-apple-darwin.tar.gz.sha256"
            "edda-${tag}-aarch64-apple-darwin.tar.gz"
            "edda-${tag}-aarch64-apple-darwin.tar.gz.sha256"
            "edda-${tag}-x86_64-pc-windows-msvc.zip"
            "edda-${tag}-x86_64-pc-windows-msvc.zip.sha256"
          )

          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Release asset set is incomplete or unexpected"
            exit 1
          fi

          empty_assets="$(gh release view "$tag" --json assets \
            --jq '.assets[] | select(.size == 0) | .name')"
          if [ -n "$empty_assets" ]; then
            echo "::error::Release contains empty assets"
            printf '%s\n' "$empty_assets"
            exit 1
          fi

          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release $tag is no longer a draft; refusing to publish"
            exit 1
          fi

          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$tag" --dir "$asset_dir" --pattern 'edda-*'
          (
            cd "$asset_dir"
            for checksum in *.sha256; do
              archive="${checksum%.sha256}"
              expected_hash="$(awk '{ print tolower($1) }' "$checksum" | tr -d '\r\n')"
              actual_hash="$(sha256sum "$archive" | awk '{ print $1 }')"
              if [[ ! "$expected_hash" =~ ^[0-9a-f]{64}$ ]] || [ "$actual_hash" != "$expected_hash" ]; then
                echo "::error::Checksum mismatch for $archive"
                exit 1
              fi
            done

          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run native asset canary without repository credentials
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          cd "$RUNNER_TEMP/release-assets"
          native_dir="edda-${tag}-x86_64-unknown-linux-gnu"
          tar -xzf "${native_dir}.tar.gz"
          actual_version="$(env -u GH_TOKEN -u GITHUB_TOKEN "./${native_dir}/edda" --version)"
          if [ "$actual_version" != "edda ${tag#v}" ]; then
            echo "::error::Native asset reports '$actual_version', expected 'edda ${tag#v}'"
            exit 1
          fi
      - name: Publish release
        run: >-
          gh release edit "${{ needs.create-release.outputs.tag }}"
          --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates-token-gate:
    name: Check crates.io publish token
    needs: [create-release, publish-release]
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          needs.create-release.result == 'success' &&
          needs.publish-release.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      token-available: ${{ steps.token.outputs.available }}
    steps:
      - name: Check for CARGO_REGISTRY_TOKEN
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "::notice::CARGO_REGISTRY_TOKEN is configured, but crates.io publishing only runs on tag pushes; publish-crates stays skipped on pull_request."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=crates.io publish skipped::CARGO_REGISTRY_TOKEN is not configured on this repository, so publish-crates will be SKIPPED. The GitHub release can ship without syncing crates.io. Add the secret to enable publishing."
          fi

  publish-crates:
    name: Publish crates to crates.io
    needs: [create-release, publish-release, crates-token-gate]
    if: >-
      always() &&
      needs.create-release.result == 'success' &&
      needs.publish-release.result == 'success' &&
      needs.crates-token-gate.result == 'success' &&
      needs.crates-token-gate.outputs.token-available == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Show toolchain
        run: cargo --version

      - name: Validate publish order covers the workspace
        shell: bash
        run: |
          members="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort)"
          expected="$(printf '%s\n' $CRATES_PUBLISH_ORDER | sort)"
          if [ "$members" != "$expected" ]; then
            echo "::error::CRATES_PUBLISH_ORDER in release.yml no longer matches the workspace member set; update it (dependencies before dependents, edda last)"
            diff <(echo "$expected") <(echo "$members") || true
            exit 1
          fi
          echo "Publish order covers all $(echo "$CRATES_PUBLISH_ORDER" | wc -w) workspace crates"

      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          failures=0
          for crate in $CRATES_PUBLISH_ORDER; do
            echo "::group::cargo publish -p $crate"
            if out="$(cargo publish --locked -p "$crate" 2>&1)"; then
              echo "$out"
              echo "::endgroup::"
              echo "$crate: published"
              # Give the crates.io index a moment to propagate the new version
              # before a dependent crate resolves against it.
              sleep 5
            else
              status=$?
              echo "$out"
              echo "::endgroup::"
              if grep -Eq "already uploaded|already exists" <<<"$out"; then
                echo "::notice::$crate is already on crates.io; treating as no-op and continuing."
              else
                echo "::error::cargo publish -p $crate failed (exit $status)."
                failures=$((failures + 1))
              fi
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::GitHub release ${tag} shipped but crates.io did not fully sync (${failures} crate(s) failed to publish). Release assets are NOT rolled back. Re-run this job after resolving the failure; crates already uploaded are treated as no-ops."
            exit 1
          fi

      - name: Verify every crate version is on crates.io
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          version="${tag#v}"
          total="$(echo "$CRATES_PUBLISH_ORDER" | wc -w)"
          missing=0
          for crate in $CRATES_PUBLISH_ORDER; do
            if curl -sf --retry 3 -H "User-Agent: edda release workflow (github.com/fagemx/edda)" \
                "https://crates.io/api/v1/crates/$crate" \
                | jq -e --arg v "$version" '.versions[]? | select(.num == $v)' > /dev/null; then
              echo "$crate@$version: present"
            else
              echo "::error::$crate@$version not found on crates.io"
              missing=$((missing + 1))
            fi
            sleep 1
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::GitHub release ${tag} shipped but crates.io did not sync: ${missing} of ${total} crates missing. Release assets are NOT rolled back. Re-run this job to retry; crates already uploaded are treated as no-ops."
            exit 1
          fi
          echo "All ${total} workspace crates are present on crates.io at ${version}"

  publish-crates-dry-run:
    name: Dry run crates.io publish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Show toolchain
        run: cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-dry-run

      - name: Validate publish order covers the workspace
        shell: bash
        run: |
          members="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort)"
          expected="$(printf '%s\n' $CRATES_PUBLISH_ORDER | sort)"
          if [ "$members" != "$expected" ]; then
            echo "::error::CRATES_PUBLISH_ORDER in release.yml no longer matches the workspace member set; update it (dependencies before dependents, edda last)"
            diff <(echo "$expected") <(echo "$members") || true
            exit 1
          fi
          echo "Publish order covers all $(echo "$CRATES_PUBLISH_ORDER" | wc -w) workspace crates"

      # Runs with NO CARGO_REGISTRY_TOKEN present: packaging and verification
      # only, nothing is uploaded. Uses --workspace (not the per-crate loop):
      # cargo packs all members into a temporary local registry, so each crate
      # is verified against its CURRENT workspace siblings rather than whatever
      # stale versions happen to be on crates.io — per-crate dry runs would
      # fail or mislead until every dependency version is actually published.
      - name: Dry run publish for the workspace
        shell: bash
        run: |
          cargo publish --workspace --dry-run --locked
          echo "Dry run passed for all $(echo "$CRATES_PUBLISH_ORDER" | wc -w) workspace crates; nothing was uploaded."
